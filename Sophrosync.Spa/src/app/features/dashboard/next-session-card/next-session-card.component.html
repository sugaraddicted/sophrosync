<div class="next-session">
  <h3 class="next-session__heading">Next Session</h3>
  @if (loading()) {
    <p class="next-session__loading">Loading…</p>
  } @else if (error()) {
    <p class="next-session__empty">Could not load session.</p>
  } @else if (nextSession()) {
    <div class="next-session__body">
      <p class="next-session__type">{{ typeLabel() }}</p>
      <p class="next-session__time">{{ formattedDate() }}</p>
      <p class="next-session__duration">{{ nextSession()!.durationMinutes }} min</p>
    </div>
  } @else {
    <div class="next-session__body">
      <p class="next-session__empty">No upcoming sessions.</p>
    </div>
  }
</div>
