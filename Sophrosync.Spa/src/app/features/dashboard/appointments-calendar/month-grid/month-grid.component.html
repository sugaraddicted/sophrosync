<div class="month-card">
  <div class="month-card__grid">
    @for (lbl of dayLabels; track lbl) {
      <div class="month-card__day-label">{{ lbl }}</div>
    }
    @for (blank of leadingBlanks(); track $index) {
      <div class="month-card__cell month-card__cell--blank"></div>
    }
    @for (day of days(); track day) {
      <div
        class="month-card__cell"
        [class.month-card__cell--has-appt]="dayMap().has(day)"
        (click)="dayClicked.emit(day)"
        role="button"
        [attr.aria-label]="'Day ' + day"
        tabindex="0"
        (keydown.enter)="dayClicked.emit(day)"
      >
        <span class="month-card__day-num">{{ day }}</span>
        @for (appt of dayMap().get(day) ?? []; track $index) {
          <div
            class="month-card__bar"
            [class.month-card__bar--no-note]="!appt.noteStatus || appt.noteStatus === 'none'"
            [class.month-card__bar--draft]="appt.noteStatus === 'Draft'"
            [class.month-card__bar--signed]="appt.noteStatus === 'Signed'"
            [class.month-card__bar--locked]="appt.noteStatus === 'Locked'"
            (click)="onApptClick($event, appt)"
            (keydown.enter)="onApptClick($event, appt)"
            tabindex="0"
            role="button"
            [attr.aria-label]="'Appointment at ' + appt.time + ' — ' + appt.client"
          >
            <span class="month-card__bar-time">{{ appt.time }}</span>
            <span class="month-card__bar-client">{{ appt.client }}</span>
          </div>
        }
      </div>
    }
  </div>
</div>
